<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f1e8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <title>OverSite</title>
  <style>
    :root {
      --ivory: #f4f1e8;
      --ink: #1d2a25;
      --ink-soft: #5d6d66;
      --jade: #149d78;
      --jade-deep: #0b7d5e;
      --jade-ink: #0a6b51;
      --glass: rgba(255, 255, 255, .55);
      --line: rgba(29, 42, 37, .12);
      --shadow: 0 8px 30px rgba(21, 64, 48, .12);
    }
    body { margin: 0; font-family: "Plus Jakarta Sans", -apple-system, "SF Pro Text", system-ui, sans-serif;
           color: var(--ink); background: var(--ivory); }
    /* Liquid-glass backdrop: soft jade and ivory light that the glass panels blur. */
    body::before { content: ""; position: fixed; inset: 0; z-index: -1;
      background:
        radial-gradient(42% 50% at 12% 16%, rgba(20, 157, 120, .17), transparent 70%),
        radial-gradient(45% 45% at 88% 10%, rgba(122, 196, 165, .20), transparent 70%),
        radial-gradient(50% 50% at 82% 86%, rgba(20, 157, 120, .13), transparent 70%),
        radial-gradient(38% 42% at 14% 90%, rgba(224, 190, 116, .16), transparent 70%),
        var(--ivory);
    }
    header { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; padding: 14px 20px;
             position: sticky; top: 0; z-index: 5; border-bottom: 1px solid rgba(255, 255, 255, .6);
             background: rgba(255, 255, 255, .55); backdrop-filter: blur(20px) saturate(170%); -webkit-backdrop-filter: blur(20px) saturate(170%);
             box-shadow: 0 6px 24px rgba(21, 64, 48, .07); }
    header h1 { font-size: 20px; font-weight: 800; margin: 0; letter-spacing: -.02em; }
    header nav { display: flex; gap: 16px; }
    a { color: var(--jade-ink); }
    main { display: grid; grid-template-columns: 1fr 360px; gap: 16px; padding: 16px; }
    h2 { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-soft); margin: 0 0 10px; }
    section + section { margin-top: 22px; }
    .muted { color: var(--ink-soft); font-size: 12.5px; }

    /* Site map: positions are fractions (0..1) of the map's width and height. */
    #map { position: relative; aspect-ratio: 16 / 10; border-radius: 20px; overflow: hidden; touch-action: none;
           background-color: rgba(255, 255, 255, .45);
           background-image: linear-gradient(rgba(20, 157, 120, .10) 1px, transparent 1px), linear-gradient(90deg, rgba(20, 157, 120, .10) 1px, transparent 1px);
           background-size: 10% 10%;
           border: 1px solid rgba(255, 255, 255, .7); box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, .8);
           backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
    #plan { position: absolute; inset: 0; width: 100%; height: 100%; display: none; }
    #trails { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .marker { position: absolute; transform: translate(-50%, -50%); }
    .cam { padding: 4px 10px; border-radius: 999px; background: rgba(255, 255, 255, .65); border: 1px solid rgba(255, 255, 255, .8);
           font-size: 12px; font-weight: 600; color: var(--ink); white-space: nowrap; cursor: grab; user-select: none; touch-action: none;
           backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 3px 10px rgba(21, 64, 48, .12); }
    .cam.offline { opacity: .55; }
    .cam.dragging { position: fixed; z-index: 10; cursor: grabbing; transform: translate(-50%, -50%); background: rgba(255, 255, 255, .9); }
    .dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 2px 8px rgba(21, 64, 48, .3); }
    .dot.low { background: #d9a40f; } .dot.medium { background: #e0812a; } .dot.high { background: #d93a42; }
    .dot.critical { background: #e11d48; animation: ping 1s infinite; }
    @keyframes ping { 50% { box-shadow: 0 0 0 10px rgba(225, 29, 72, .25); } }
    .worker { padding: 3px 9px; border-radius: 999px; background: rgba(20, 157, 120, .16); border: 1px solid rgba(20, 157, 120, .45);
              color: var(--jade-ink); font-size: 12px; font-weight: 600; white-space: nowrap; }
    #tray { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; min-height: 26px; }
    #tray .cam { position: static; }

    #cameras { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
    .tile { background: var(--glass); backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, .7); border-radius: 18px; overflow: hidden;
            box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, .8); }
    .tile img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; background: #0c1512; display: block; }
    .tile .info { padding: 10px 12px; font-size: 14px; }
    .tile .name { font-weight: 700; }

    .threat { padding: 12px 14px; margin-bottom: 10px; border-radius: 14px; font-size: 14px;
              background: var(--glass); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
              border: 1px solid rgba(255, 255, 255, .65); border-left-width: 6px;
              box-shadow: 0 6px 18px rgba(21, 64, 48, .08); }
    .threat.low { border-left-color: #d9a40f; } .threat.medium { border-left-color: #e0812a; } .threat.high { border-left-color: #d93a42; }
    .threat.critical { border-left-color: #e11d48; background: rgba(225, 29, 72, .10); }
    .threat.stale { opacity: .6; }
    .kind { font-weight: 700; text-transform: capitalize; }
    .threat button { margin-top: 8px; padding: 7px 14px; border: 1px solid rgba(255, 255, 255, .5); border-radius: 10px; cursor: pointer;
                     font-family: inherit; color: #fff; font-weight: 650;
                     background: linear-gradient(180deg, rgba(255, 255, 255, .25), rgba(255, 255, 255, 0) 42%), var(--jade);
                     box-shadow: 0 4px 12px rgba(20, 157, 120, .3), inset 0 1px 0 rgba(255, 255, 255, .45); }
    #banner { display: none; padding: 14px 16px; color: #fff; font-weight: 700; font-size: 20px;
              background: rgba(219, 45, 57, .92); border-bottom: 1px solid rgba(255, 255, 255, .35);
              backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
    #banner.on { display: block; animation: pulse 1s infinite alternate; }
    @keyframes pulse { to { background-color: rgba(154, 18, 30, .92); } }
    #log div { font-size: 13px; color: var(--ink-soft); padding: 5px 0; border-bottom: 1px solid rgba(29, 42, 37, .08); }
    @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div id="banner"></div>
  <header>
    <h1>OverSite</h1>
    <nav><a href="/worker">Worker app</a><a href="/report">Report a hazard</a><a href="/camera">Use this device as a camera</a></nav>
  </header>
  <main>
    <div>
      <section>
        <h2>Site map</h2>
        <div id="map">
          <img id="plan" src="/floorplan" alt="">
          <svg id="trails" viewBox="0 0 1 1" preserveAspectRatio="none"></svg>
          <div id="markers"></div>
        </div>
        <div id="tray"></div>
        <p class="muted">Drag cameras onto the map where they are. Add a floorplan.png next to the server to use a real floor plan.</p>
      </section>
      <section>
        <h2>Cameras</h2>
        <div id="cameras"></div>
        <p id="no-cameras" class="muted">No cameras yet. Open <a href="/camera">/camera</a> on a phone or laptop.</p>
      </section>
    </div>
    <div>
      <section>
        <h2>Threat board</h2>
        <div id="threats"></div>
      </section>
      <section>
        <h2>Event log</h2>
        <div id="log"></div>
      </section>
    </div>
  </main>
  <script>
    const $ = id => document.getElementById(id);
    const label = kind => kind.replaceAll('_', ' ');
    const el = (tag, className, text) => {
      const e = document.createElement(tag);
      if (className) e.className = className;
      if (text !== undefined) e.textContent = text;
      return e;
    };
    const place = (node, pos) => { node.style.left = `${pos.x * 100}%`; node.style.top = `${pos.y * 100}%`; };

    // Use the floor plan's own shape so map positions line up with the picture.
    $('plan').onload = () => {
      $('map').style.aspectRatio = `${$('plan').naturalWidth} / ${$('plan').naturalHeight}`;
      $('plan').style.display = 'block';
    };

    // Dragging a camera chip onto the map saves its position on the server.
    let dragging = false;
    function makeDraggable(chip, name) {
      chip.addEventListener('pointerdown', e => {
        e.preventDefault();
        dragging = true;
        chip.setPointerCapture(e.pointerId);
        chip.classList.add('dragging');
        const follow = ev => { chip.style.left = `${ev.clientX}px`; chip.style.top = `${ev.clientY}px`; };
        follow(e);
        chip.onpointermove = follow;
        chip.onpointerup = async ev => {
          chip.onpointermove = chip.onpointerup = null;
          const r = $('map').getBoundingClientRect();
          const x = (ev.clientX - r.left) / r.width, y = (ev.clientY - r.top) / r.height;
          if (x >= 0 && x <= 1 && y >= 0 && y <= 1) {
            await fetch(`/place?camera=${encodeURIComponent(name)}&x=${x}&y=${y}`, { method: 'POST' });
          }
          dragging = false;
          poll();
        };
      });
    }

    function renderMap(cameras, threats, workers) {
      if (dragging) return; // don't rebuild the chip that's being dragged
      const markers = [], tray = [];
      for (const cam of cameras) {
        const chip = el('div', `cam${cam.online ? '' : ' offline'}`, `📷 ${cam.name}`);
        makeDraggable(chip, cam.name);
        if (cam.pos) {
          chip.classList.add('marker');
          place(chip, cam.pos);
          markers.push(chip);
        } else {
          tray.push(chip);
        }
      }
      const lines = [];
      for (const t of threats) {
        const here = t.trail[t.trail.length - 1];
        if (!here) continue; // no position (unplaced camera, or worker didn't tap the map)
        const dot = el('div', `marker dot ${t.critical ? 'critical' : t.severity}`);
        dot.title = `${label(t.kind)}: ${t.reason}`;
        place(dot, here);
        markers.push(dot);
        if (t.trail.length > 1) {
          // Where a moving threat has been, drawn as a line through its sightings.
          const line = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
          line.setAttribute('points', t.trail.map(p => `${p.x},${p.y}`).join(' '));
          line.setAttribute('fill', 'none');
          line.setAttribute('stroke', t.critical ? '#e11d48' : '#e0812a');
          line.setAttribute('stroke-width', '3');
          line.setAttribute('stroke-dasharray', '6 4');
          line.setAttribute('vector-effect', 'non-scaling-stroke');
          lines.push(line);
        }
      }
      for (const w of workers) {
        const chip = el('div', 'marker worker', `👷 ${w.name}`);
        place(chip, w.pos);
        markers.push(chip);
      }
      $('markers').replaceChildren(...markers);
      $('trails').replaceChildren(...lines);
      $('tray').replaceChildren(...tray);
    }

    // Camera tiles are kept between polls so images only reload when a new frame exists.
    const tiles = new Map(); // camera name -> { img, info, version }
    function renderCamera(cam) {
      if (!tiles.has(cam.name)) {
        const root = el('div', 'tile');
        const img = el('img');
        img.alt = cam.name;
        const info = el('div', 'info');
        root.append(img, info);
        $('cameras').appendChild(root);
        tiles.set(cam.name, { img, info, version: 0 });
      }
      const tile = tiles.get(cam.name);
      if (cam.frame_version !== tile.version) {
        tile.version = cam.frame_version;
        if (cam.frame_version) tile.img.src = `/frame?camera=${encodeURIComponent(cam.name)}&v=${cam.frame_version}`;
      }
      const seeing = cam.raw.map(h => label(h.kind)).join(', ');
      tile.info.replaceChildren(
        el('div', 'name', cam.name),
        el('div', 'muted', `${cam.online ? '● live' : '○ offline'}${seeing ? ` · seeing: ${seeing}` : ''}`),
      );
    }

    function renderThreat(t) {
      const card = el('div', `threat ${t.critical ? 'critical' : t.severity}${t.stale ? ' stale' : ''}`);
      const status = t.critical ? 'CRITICAL' : t.severity;
      card.append(
        el('div', 'kind', `${label(t.kind)} · ${status}`),
        el('div', '', t.location),
        el('div', '', t.reason),
        el('div', 'muted', `${t.sources.join(' → ')} · ${t.seconds}s ago${t.stale ? ' · not seen recently' : ''}` +
          (t.needs_person ? '' : ' · fades on its own')),
      );
      const button = el('button', '', 'Resolve');
      button.onclick = async () => {
        button.disabled = true;
        await fetch(`/resolve?id=${t.id}`, { method: 'POST' });
        poll();
      };
      card.append(button);
      return card;
    }

    function render({ cameras, threats, workers, log }) {
      renderMap(cameras, threats, workers);
      $('no-cameras').hidden = cameras.length > 0;
      cameras.forEach(renderCamera);

      $('threats').replaceChildren(...(threats.length ? threats.map(renderThreat) : [el('p', 'muted', 'No threats.')]));

      const critical = threats.filter(t => t.critical).map(t => `${label(t.kind)} (${t.sources.at(-1)})`);
      $('banner').className = critical.length ? 'on' : '';
      $('banner').textContent = critical.length ? `⚠ CRITICAL: ${critical.join(' · ').toUpperCase()}` : '';

      $('log').replaceChildren(...log.map(e => {
        const what = e.event === 'resolved' ? (e.by === 'faded' ? 'FADED' : 'RESOLVED') : e.event.toUpperCase();
        return el('div', '', `${new Date(e.at_ms).toLocaleTimeString()}  ${e.source}  ${what}  ${label(e.kind)}` +
          (e.reason ? ` — ${e.reason}` : ''));
      }));
    }

    async function poll() {
      try {
        const res = await fetch('/state');
        if (res.ok) render(await res.json());
      } catch {}
    }
    poll();
    setInterval(poll, 1000);
  </script>
</body>
</html>
