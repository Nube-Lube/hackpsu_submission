<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hazard Watch Worker</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #111; color: #eee; }
    main { max-width: 560px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 20px; margin: 0 0 12px; }
    h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: #888; margin: 18px 0 8px; }
    a { color: #f0b429; }
    #setup { display: flex; gap: 8px; }
    #setup input { flex: 1; padding: 12px; font-size: 16px; border-radius: 6px; border: 1px solid #444; background: #1c1c1c; color: #eee; }
    button, .button { padding: 12px 16px; font-size: 16px; font-weight: 700; border: 0; border-radius: 6px; background: #f0b429; color: #111; text-decoration: none; display: inline-block; }
    .muted { color: #777; font-size: 13px; }
    #alert { display: none; padding: 14px; margin-bottom: 12px; border-radius: 6px; background: #c1121f; font-weight: 700; font-size: 18px; }
    #alert.on { display: block; animation: pulse 1s infinite alternate; }
    @keyframes pulse { to { background: #7a0a13; } }

    /* Same map as the dashboard: positions are fractions (0..1) of width and height. */
    #map { position: relative; aspect-ratio: 16 / 10; border-radius: 6px; overflow: hidden; cursor: crosshair;
           background-color: #161616;
           background-image: linear-gradient(#262626 1px, transparent 1px), linear-gradient(90deg, #262626 1px, transparent 1px);
           background-size: 10% 10%; }
    #plan { position: absolute; inset: 0; width: 100%; height: 100%; display: none; }
    .marker { position: absolute; transform: translate(-50%, -50%); }
    .dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #111; }
    .dot.low { background: #e0c341; } .dot.medium { background: #f08a24; } .dot.high { background: #e5383b; }
    .dot.critical { background: #ff1f3d; }
    #me { display: none; width: 18px; height: 18px; border-radius: 50%; background: #4ea8de; border: 3px solid #fff; }
    #range { display: none; border: 2px dashed rgba(78, 168, 222, .5); border-radius: 50%; pointer-events: none; }

    .threat { padding: 10px; margin-bottom: 8px; border-radius: 6px; border-left: 6px solid; background: #1c1c1c; }
    .threat.low { border-color: #e0c341; } .threat.medium { border-color: #f08a24; } .threat.high { border-color: #e5383b; }
    .threat.critical { border-color: #ff1f3d; background: #3a0d12; }
    .kind { font-weight: 600; text-transform: capitalize; }
  </style>
</head>
<body>
  <main>
    <h1>Hazard Watch</h1>
    <form id="setup">
      <input id="name" placeholder="Your name" maxlength="40" required>
      <button>Start</button>
    </form>
    <div id="app" hidden>
      <div id="alert"></div>
      <p id="status" class="muted">Tap the map where you are.</p>
      <div id="map">
        <img id="plan" src="/floorplan" alt="">
        <div id="range" class="marker"></div>
        <div id="markers"></div>
        <div id="me" class="marker"></div>
      </div>
      <h2>Near you</h2>
      <div id="nearby"></div>
      <p><a id="report" class="button" href="/report">Report a hazard</a></p>
    </div>
  </main>
  <script>
    const $ = id => document.getElementById(id);
    const label = kind => kind.replaceAll('_', ' ');
    const el = (tag, className, text) => {
      const e = document.createElement(tag);
      if (className) e.className = className;
      if (text !== undefined) e.textContent = text;
      return e;
    };
    const place = (node, pos) => { node.style.left = `${pos.x * 100}%`; node.style.top = `${pos.y * 100}%`; };

    const NEARBY = 0.2; // fraction of the map; threats closer than this count as "near you"
    let name = '', me = null, audio = null;
    const alerted = new Set(); // "id" or "id:critical", so each threat alerts once (and again if it turns critical)

    try { $('name').value = localStorage.getItem('workerName') || ''; } catch {}

    $('plan').onload = () => {
      $('map').style.aspectRatio = `${$('plan').naturalWidth} / ${$('plan').naturalHeight}`;
      $('plan').style.display = 'block';
    };

    // Start needs a tap: browsers only allow sound (and ask for notifications) after a user gesture.
    $('setup').addEventListener('submit', e => {
      e.preventDefault();
      name = $('name').value.trim();
      try { localStorage.setItem('workerName', name); } catch {}
      audio = new (window.AudioContext || window.webkitAudioContext)();
      if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();
      $('setup').hidden = true;
      $('app').hidden = false;
      poll();
      setInterval(poll, 2000);
      setInterval(checkIn, 10000); // keeps us on the dashboard map while the page is open
    });

    // "I'm here": tap the map.
    $('map').addEventListener('click', e => {
      const r = $('map').getBoundingClientRect();
      me = { x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height };
      place($('me'), me);
      place($('range'), me);
      $('range').style.width = `${NEARBY * 2 * r.width}px`;
      $('range').style.height = `${NEARBY * 2 * r.height}px`;
      $('me').style.display = $('range').style.display = 'block';
      $('report').href = `/report?x=${me.x}&y=${me.y}`;
      $('status').textContent = 'Location set. Tap again if you move.';
      checkIn();
      poll();
    });

    function checkIn() {
      if (!me) return;
      fetch('/checkin', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, pos: me }) });
    }

    // Beep, buzz, and a system notification if allowed. Only works while this page is open.
    function alarm(text) {
      $('alert').textContent = `⚠ ${text}`;
      $('alert').className = 'on';
      navigator.vibrate?.([300, 150, 300]);
      if (audio) {
        const osc = audio.createOscillator();
        osc.frequency.value = 880;
        osc.connect(audio.destination);
        osc.start();
        osc.stop(audio.currentTime + 0.4);
      }
      try { if (Notification.permission === 'granted') new Notification('Hazard Watch', { body: text }); } catch {}
    }

    const distance = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

    function render({ threats }) {
      const dots = [];
      for (const t of threats) {
        const here = t.trail.at(-1);
        if (!here) continue;
        const dot = el('div', `marker dot ${t.critical ? 'critical' : t.severity}`);
        place(dot, here);
        dots.push(dot);
      }
      $('markers').replaceChildren(...dots);

      if (!me) {
        $('nearby').replaceChildren(el('p', 'muted', 'Set your location on the map to see threats near you.'));
        return;
      }
      const near = threats.filter(t => t.trail.length && distance(t.trail.at(-1), me) <= NEARBY);
      $('nearby').replaceChildren(...(near.length ? near.map(t => {
        const card = el('div', `threat ${t.critical ? 'critical' : t.severity}`);
        card.append(
          el('div', 'kind', `${label(t.kind)} · ${t.critical ? 'CRITICAL' : t.severity}`),
          el('div', '', t.location),
          el('div', 'muted', t.reason),
        );
        return card;
      }) : [el('p', 'muted', 'Nothing near you.')]));

      for (const t of near) {
        const key = t.critical ? `${t.id}:critical` : `${t.id}`;
        if (alerted.has(key)) continue;
        alerted.add(key);
        alarm(t.kind === 'person_down' ? 'Someone may need help nearby!' : `${label(t.kind)} near you: ${t.location}`);
      }
      if (!near.length) $('alert').className = ''; // banner stays up while anything is near you
    }

    async function poll() {
      try {
        const res = await fetch('/state');
        if (res.ok) render(await res.json());
      } catch {}
    }
  </script>
</body>
</html>
