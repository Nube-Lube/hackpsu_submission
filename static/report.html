<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f1e8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <title>Report a Hazard</title>
  <style>
    :root {
      --ivory: #f4f1e8;
      --ink: #1d2a25;
      --ink-soft: #5d6d66;
      --jade: #149d78;
      --jade-deep: #0b7d5e;
      --jade-ink: #0a6b51;
      --glass: rgba(255, 255, 255, .55);
      --line: rgba(29, 42, 37, .12);
      --shadow: 0 8px 30px rgba(21, 64, 48, .12);
    }
    body { margin: 0; font-family: "Plus Jakarta Sans", -apple-system, "SF Pro Text", system-ui, sans-serif;
           color: var(--ink); background: var(--ivory); }
    /* Liquid-glass backdrop: soft jade and ivory light that the glass panels blur. */
    body::before { content: ""; position: fixed; inset: 0; z-index: -1;
      background:
        radial-gradient(42% 50% at 12% 16%, rgba(20, 157, 120, .17), transparent 70%),
        radial-gradient(45% 45% at 88% 10%, rgba(122, 196, 165, .20), transparent 70%),
        radial-gradient(50% 50% at 82% 86%, rgba(20, 157, 120, .13), transparent 70%),
        radial-gradient(38% 42% at 14% 90%, rgba(224, 190, 116, .16), transparent 70%),
        var(--ivory);
    }
    main { max-width: 520px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 24px; font-weight: 800; letter-spacing: -.02em; }
    label { display: block; margin: 14px 0 6px; font-size: 13px; font-weight: 600; color: var(--ink-soft); }
    input, select, textarea { width: 100%; box-sizing: border-box; padding: 12px 14px; font-size: 16px; border-radius: 12px;
                              border: 1px solid var(--line); background: var(--glass); color: var(--ink); font-family: inherit;
                              backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
                              box-shadow: inset 0 1px 2px rgba(29, 42, 37, .05); }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--jade); box-shadow: 0 0 0 3px rgba(20, 157, 120, .18); }
    textarea { min-height: 90px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    button { width: 100%; margin-top: 20px; padding: 14px; font-size: 18px; font-weight: 650; border: 1px solid rgba(255, 255, 255, .5);
             border-radius: 14px; cursor: pointer; color: #fff; font-family: inherit;
             background: linear-gradient(180deg, rgba(255, 255, 255, .25), rgba(255, 255, 255, 0) 42%), var(--jade);
             box-shadow: 0 8px 22px rgba(20, 157, 120, .38), inset 0 1px 0 rgba(255, 255, 255, .45); }
    button:disabled { opacity: .5; }
    #result { margin-top: 14px; font-weight: 600; }
    .ok { color: var(--jade-deep); } .err { color: #c01037; }
    a { color: var(--jade-ink); }
    #map { position: relative; aspect-ratio: 16 / 10; border-radius: 18px; overflow: hidden; cursor: crosshair;
           background-color: rgba(255, 255, 255, .45);
           background-image: linear-gradient(rgba(20, 157, 120, .10) 1px, transparent 1px), linear-gradient(90deg, rgba(20, 157, 120, .10) 1px, transparent 1px);
           background-size: 10% 10%;
           border: 1px solid rgba(255, 255, 255, .7); box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, .8);
           backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
    #plan { position: absolute; inset: 0; width: 100%; height: 100%; display: none; }
    #pin { position: absolute; display: none; width: 18px; height: 18px; border-radius: 50%; background: var(--jade);
           border: 2px solid #fff; transform: translate(-50%, -50%); box-shadow: 0 2px 8px rgba(21, 64, 48, .35); }
  </style>
</head>
<body>
  <main>
    <h1>Report a hazard</h1>
    <form id="form">
      <label for="name">Your name</label>
      <input id="name" maxlength="40" placeholder="Optional">
      <div class="row">
        <div>
          <label for="kind">What is it?</label>
          <select id="kind" required></select>
        </div>
        <div>
          <label for="severity">Severity?</label>
          <select id="severity">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
          </select>
        </div>
      </div>
      <label for="location">Where?</label>
      <input id="location" maxlength="200" placeholder="e.g. bay 3, by the loading door" required>
      <label>Tap the map where it is (optional)</label>
      <div id="map"><img id="plan" src="/floorplan" alt=""><div id="pin"></div></div>
      <label for="note">Details</label>
      <textarea id="note" maxlength="500" placeholder="What did you see?"></textarea>
      <button id="send">Send report</button>
    </form>
    <div id="result"></div>
    <p><a href="/">Open dashboard</a></p>
  </main>
  <script>
    const $ = id => document.getElementById(id);
    const label = kind => kind.replaceAll('_', ' ');

    try { $('name').value = localStorage.getItem('workerName') || ''; } catch {}

    // Map position as fractions (0..1) of the map, same as the dashboard.
    let pos = null;
    function setPin(p) {
      pos = p;
      $('pin').style.left = `${pos.x * 100}%`;
      $('pin').style.top = `${pos.y * 100}%`;
      $('pin').style.display = 'block';
    }
    // The worker app links here with ?x=..&y=.. so the pin starts where the worker is.
    const params = new URLSearchParams(location.search);
    if (params.has('x') && params.has('y')) setPin({ x: +params.get('x'), y: +params.get('y') });
    $('plan').onload = () => {
      $('map').style.aspectRatio = `${$('plan').naturalWidth} / ${$('plan').naturalHeight}`;
      $('plan').style.display = 'block';
    };
    $('map').addEventListener('click', e => {
      const r = $('map').getBoundingClientRect();
      setPin({ x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height });
    });

    // Hazard kinds come from the server's hazards.toml.
    fetch('/kinds').then(r => r.json()).then(kinds => {
      for (const k of kinds) {
        const opt = document.createElement('option');
        opt.value = k;
        opt.textContent = label(k);
        $('kind').appendChild(opt);
      }
    });

    $('form').addEventListener('submit', async e => {
      e.preventDefault();
      $('send').disabled = true;
      try { localStorage.setItem('workerName', $('name').value.trim()); } catch {}
      try {
        const res = await fetch('/report', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: $('name').value, kind: $('kind').value, severity: $('severity').value,
            location: $('location').value, note: $('note').value, pos,
          }),
        });
        if (!res.ok) throw new Error(await res.text());
        $('result').className = 'ok';
        $('result').textContent = 'Reported. It is on the dashboard now.';
        $('location').value = '';
        $('note').value = '';
        pos = null;
        $('pin').style.display = 'none';
      } catch (err) {
        $('result').className = 'err';
        $('result').textContent = `Could not send: ${err.message}`;
      }
      $('send').disabled = false;
    });
  </script>
</body>
</html>
